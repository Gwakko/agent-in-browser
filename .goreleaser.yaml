# https://goreleaser.com — run by .github/workflows/release.yml on tags v*.
version: 2

project_name: agent-in-browser

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: agent-in-browser
    main: ./cmd/agent-in-browser
    binary: agent-in-browser
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # agent-in-browser_0.1.0_darwin_arm64.tar.gz — matched by scripts/install.sh
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - skills/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

# Homebrew: create github.com/gwakko/homebrew-tap, add a HOMEBREW_TAP_TOKEN
