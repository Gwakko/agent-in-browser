<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIB Fixture: Sign up</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    label { display: block; margin: 12px 0 4px; }
    .card { padding: 8px; border: 1px solid #ccc; cursor: pointer; margin-top: 16px; }
    #result { margin-top: 16px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header><nav aria-label="Primary"><a href="#home">Home</a> <a href="#docs">Docs</a></nav></header>
  <main>
    <h1>Create account</h1>
    <p>Fill the form to see the scenario runner in action.</p>
    <form id="signup" onsubmit="event.preventDefault(); submitForm();">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <label for="name">Name</label>
      <input id="name" name="name">
      <label for="plan">Plan</label>
      <select id="plan"><option value="free">Free</option><option value="pro">Pro</option><option value="team">Team</option></select>
      <label><input id="tos" type="checkbox"> I accept the terms</label>
      <button type="submit">Sign up</button>
    </form>
    <div class="card" onclick="document.getElementById('result').textContent='Card clicked'">Clickable card</div>
    <div id="result" role="status"></div>
    <button id="lazy" class="hidden">Appears later</button>
  </main>
  <script>
    function submitForm() {
      const email = document.getElementById('email').value;
      const plan = document.getElementById('plan').value;
      const tos = document.getElementById('tos').checked;
      if (!tos) { console.warn('terms not accepted'); document.getElementById('result').textContent = 'Please accept the terms'; return; }
      console.log('submitted', email, plan);
      document.getElementById('result').textContent = 'Welcome ' + email + ' on ' + plan;
      setTimeout(() => document.getElementById('lazy').classList.remove('hidden'), 500);
    }
    console.info('fixture loaded');
  </script>
</body>
</html>
